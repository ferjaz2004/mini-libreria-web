<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIENDA - Mini Librería y Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4 text-primary">📦 Catálogo de Productos - Mini Librería</h1>
        
        <div class="row">
            {% for p in productos %}
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm p-3">
                    <h3>{{ p[1] }}</h3>
                    <p class="text-success fw-bold fs-5">Q{{ "%.2f"|format(p[2]) }}</p>
                    <p class="text-muted">Stock disponible: {{ p[3] }}</p>
                    <button class="btn btn-primary" onclick="alert('Producto seleccionado: {{ p[1] }}')">🛒 Comprar</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
